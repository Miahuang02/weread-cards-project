name: 每日同步微信读书划线

on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 安装Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libharfbuzz0b libpangoft2-1.0-0 libffi-dev libjpeg-dev libopenjp2-7-dev
      - name: 安装Python依赖
        run: pip install requests weasyprint
      - name: 拉取微信读书划线
        env:
          WEREAD_API_KEY: ${{ secrets.WEREAD_API_KEY }}
        run: python scripts/sync_weread.py
      - name: 生成卡片网页
        run: python scripts/generate_html.py
      - name: 生成打印PDF
        run: python scripts/generate_pdf.py
        continue-on-error: true
      - name: 提交更新
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add data/highlights.json index.html highlights.pdf print.html
          git diff --staged --quiet || git commit -m "自动同步划线"
          git push
