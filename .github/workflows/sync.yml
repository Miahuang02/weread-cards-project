name: 每日同步微信读书划线

on:
  schedule:
    # 每天北京时间凌晨 3:00 运行（UTC 19:00）
    - cron: '0 19 * * *'
  workflow_dispatch: # 支持手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install requests pillow

      - name: 拉取微信读书划线
        env:
          WEREAD_API_KEY: ${{ secrets.WEREAD_API_KEY }}
        run: python scripts/sync_weread.py

      - name: 生成卡片网页
        run: python scripts/generate_html.py

      - name: 生成打印PDF
        run: python scripts/generate_pdf.py

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/highlights.json index.html highlights.pdf
          git diff --staged --quiet || git commit -m "自动同步划线 $(date -u +'%Y-%m-%d')"
          git push
